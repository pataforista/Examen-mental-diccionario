<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#FBF1EC" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="../shared/fonts.css" />
    <link rel="stylesheet" href="../shared/humano-tokens.css" />
    <link rel="stylesheet" href="styles.css" />
    <script>
        (function () {
            var t;
            try { t = localStorage.getItem('theme'); } catch (e) { console.warn('Tema: no se pudo leer la preferencia', e); }
            if (t !== 'light' && t !== 'dark') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <title>Entrenamiento | Diccionario de examen mental</title>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <div class="title">Entrenamiento</div>
            <div class="subtitle">Definiciones y diagnóstico diferencial en dos pasos</div>
        </div>

        <div class="top-actions">
            <button id="btnTheme" class="btn ghost" title="Cambiar modo visual" aria-label="Cambiar modo visual"></button>
            <button id="btnInstall" class="btn ghost" hidden>Instalar</button>
            <button id="btnReset" class="btn ghost" title="Borra progreso local">Reiniciar</button>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <div class="row">
                <label class="label">Modo</label>
                <div class="segmented" role="tablist">
                    <button class="seg" id="modeMcq" aria-selected="true">Definiciones</button>
                    <button class="seg" id="modeDiff" aria-selected="false">Diferencial 2 pasos</button>
                </div>
            </div>

            <div class="row">
                <label class="label" for="domainSelect">Dominio</label>
                <select id="domainSelect" class="select"></select>

                <label class="label" for="difficultySelect">Dificultad</label>
                <select id="difficultySelect" class="select">
                    <option value="any">Cualquiera</option>
                    <option value="1">1 (fácil)</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>

                <button id="btnNext" class="btn primary">Siguiente</button>
            </div>

            <div class="stats">
                <div><span class="k">Puntaje</span> <span id="score">0</span></div>
                <div><span class="k">Racha</span> <span id="streak">0</span></div>
                <div><span class="k">Correctas</span> <span id="correct">0</span></div>
                <div><span class="k">Incorrectas</span> <span id="wrong">0</span></div>
            </div>
        </section>

        <section class="card" id="gameCard">
            <div id="prompt" class="prompt"></div>
            <div id="subprompt" class="subprompt"></div>
            <div id="options" class="options"></div>

            <div id="feedback" class="feedback" aria-live="polite"></div>

            <div class="footer">
                <div class="hint" id="hint"></div>
            </div>
        </section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
