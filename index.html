<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSE | Soft Ruins & Black Signal</title>
    <!-- Fonts: Outfit (Valley) & Space Grotesk (Void) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico">
    <meta name="theme-color" content="#FFF8E7">
</head>

<body data-theme="light">
    <header class="app-header">
        <div class="header-top">
            <button id="theme-toggle" class="icon-btn" title="Alternar Realidad">🌓</button>
            <div class="ritual-header">
                <span class="ritual-subtitle">EMA CANÓNICO</span>
                <h1 id="app-title">SOFT RUINS</h1>
            </div>
            <button id="about-btn" class="icon-btn">ℹ️</button>
        </div>
        <div class="search-container">
            <input type="text" id="global-search" placeholder="Buscar en el bosque..." autocomplete="off">
        </div>
    </header>

    <main id="app-content">
        <section id="dictionary-view">
            <div id="recent-searches" class="recent-searches-container hidden">
                <span class="section-label">Recientes</span>
                <div id="recent-list"></div>
            </div>
            <div id="all-terms-list">
                <!-- Alphabetical list will be rendered here -->
            </div>
        </section>
        <section id="results-view" class="hidden"></section>
        <section id="term-view" class="hidden"></section>
        <section id="domain-view" class="hidden"></section>
        <section id="cases-view" class="hidden"></section>
        <section id="about-view" class="hidden"></section>
    </main>

    <nav class="bottom-nav">
        <button id="nav-dictionary" class="active">
            <span class="nav-icon">📖</span>
            <span>Diccionario</span>
        </button>
        <button id="nav-domains">
            <span class="nav-icon">🧩</span>
            <span>Dominios</span>
        </button>
        <button id="nav-cases">
            <span class="nav-icon">📋</span>
            <span>Casos OSCE</span>
        </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.basic.min.js"></script>
    <script src="app.js" type="module"></script>
</body>

</html>
