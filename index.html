<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Examen Mental - Diccionario Clínico</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico">
    <meta name="theme-color" content="#003366">
</head>
<body>
    <header class="app-header">
        <h1>Examen Mental</h1>
        <div class="search-container">
            <input type="text" id="global-search" placeholder="Buscar término, síntoma o signo..." autocomplete="off">
        </div>
    </header>

    <main id="app-content">
        <!-- Dynamic content goes here -->
        <section id="results-view" class="hidden"></section>
        <section id="term-view" class="hidden"></section>
        <section id="domain-view"></section>
        <section id="cases-view" class="hidden"></section>
    </main>

    <nav class="bottom-nav">
        <button id="nav-dictionary" class="active">Diccionario</button>
        <button id="nav-domains">Dominios</button>
        <button id="nav-cases">Casos OSCE</button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.basic.min.js"></script>
    <script src="app.js" type="module"></script>
</body>
</html>
